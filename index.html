<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VITAL-PAL — Clinical Telemetry Monitor</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
:root{--bg:#0b0f19;--ink:#f1f5f0;--mint:#10B981;--neon:#00E676;--slate:#020617;--card:#131b2e;--muted:#94a3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
.display{font-family:'Archivo Black','Arial Black',sans-serif;text-transform:uppercase;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.cta{background:var(--neon);color:#052e1a;font-weight:700;border-radius:999px;padding:.5rem 1rem;font-size:.8rem;transition:.2s}
.cta:hover{box-shadow:0 0 20px rgba(0,230,118,.5);transform:translateY(-1px)}
.panel{background:var(--card);border-radius:1rem;padding:1rem;box-shadow:0 8px 24px -10px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.05)}
.beat{animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
</style>
</head>
<body class="p-4 max-w-6xl mx-auto space-y-4 pt-16">

<!-- HEADER BAR -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-center px-3 py-2">
 <div class="w-full max-w-6xl flex items-center justify-between gap-2 rounded-full px-4 py-2 backdrop-blur bg-slate-900/80 border border-white/10">
  <div class="flex items-center gap-2 display text-base"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>VITAL-PAL</div>
  <button id="btBtn" class="cta">Connect Serial / BT</button>
 </div>
</header>

<!-- CONNECTION CONTROLS -->
<div class="panel flex flex-wrap items-center justify-between gap-3 border-emerald-500/30">
 <div class="flex items-center gap-2">
  <span class="mono text-xs text-slate-400">Gateway:</span>
  <input id="wsIp" type="text" value="vitalpal.local" class="px-3 py-1 text-xs mono w-36 text-slate-100 bg-slate-900 border border-slate-700 rounded-lg">
  <button id="wsConnectBtn" class="cta">Connect WebSocket</button>
 </div>
 <div id="wsStatus" class="mono text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 font-bold">Disconnected</div>
</div>

<!-- METRIC CARDS -->
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
 <div class="panel border-l-4 border-red-500">
  <div class="mono text-[10px] text-slate-400">HEART RATE</div>
  <div class="flex items-baseline gap-2 mt-1"><span id="bpm" class="display text-3xl text-red-400">--</span><span class="mono text-xs text-slate-400">BPM</span><span class="beat ml-auto text-xl text-emerald-400">♥</span></div>
  <div id="lock" class="mono text-[10px] mt-1 text-amber-400">○ SEARCHING</div>
 </div>

 <div class="panel border-l-4 border-cyan-500">
  <div class="mono text-[10px] text-slate-400">BLOOD OXYGEN</div>
  <div class="flex items-baseline gap-2 mt-1"><span id="spo2" class="display text-3xl text-cyan-400">--%</span></div>
 </div>

 <div class="panel border-l-4 border-emerald-500">
  <div class="mono text-[10px] text-slate-400">ECG (RAW / mV)</div>
  <div class="flex items-baseline gap-2 mt-1"><span id="ecgRaw" class="display text-3xl text-emerald-400">0</span><span id="ecgMv" class="mono text-xs text-slate-400">0.00 mV</span></div>
 </div>

 <div class="panel border-l-4 border-amber-500">
  <div class="mono text-[10px] text-slate-400">EMG (RAW / µV)</div>
  <div class="flex items-baseline gap-2 mt-1"><span id="emgRaw" class="display text-3xl text-amber-400">0</span><span id="emgUv" class="mono text-xs text-slate-400">0 µV</span></div>
 </div>
</div>

<!-- DIAGNOSTICS BAR -->
<div id="diagnostics" class="panel border border-emerald-500/20 bg-slate-900/40 flex items-center justify-between gap-4 py-2 px-4">
 <span id="healthSummary" class="text-xs text-slate-300 font-medium">Streaming live biopotentials...</span>
 <span id="healthBadge" class="mono text-xs px-2.5 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">MONITORING</span>
</div>

<!-- OSCILLOSCOPES -->
<div class="grid lg:grid-cols-2 gap-4">
 
 <!-- ECG Canvas -->
 <div class="panel bg-slate-950">
  <div class="mono text-xs flex justify-between items-center mb-1">
   <span class="text-emerald-400 font-bold">ECG WAVEFORM</span>
   <span id="ecgHeaderRange" class="text-slate-400">MIN: 0 | MAX: 0</span>
  </div>
  <canvas id="ecgCanvas" class="w-full" style="height:240px; background:#040d1a; border-radius:0.5rem"></canvas>
 </div>

 <!-- EMG Canvas -->
 <div class="panel bg-slate-950">
  <div class="mono text-xs flex justify-between items-center mb-1">
   <span class="text-amber-400 font-bold">EMG WAVEFORM</span>
   <span id="emgHeaderRange" class="text-amber-300 font-bold">MIN: 0 | MAX: 0</span>
  </div>
  <canvas id="emgCanvas" class="w-full" style="height:240px; background:#0d121f; border-radius:0.5rem"></canvas>
 </div>

</div>

<!-- SYSTEM LOGS -->
<div class="panel bg-slate-950">
 <div class="flex items-center justify-between mb-1">
  <div class="mono text-[10px] text-slate-400">EVENT LOGS</div>
  <span id="dbCounter" class="mono text-[10px] text-emerald-400">0 samples logged</span>
 </div>
 <div id="log" class="mono text-[11px] h-20 overflow-y-auto space-y-0.5 bg-slate-900 p-2 rounded text-slate-400"></div>
</div>

<!-- APPLICATION ENGINE -->
<script>
const $=s=>document.querySelector(s);

function addLog(m) {
  const d = document.createElement('div');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;
  const logContainer = $('#log');
  if (logContainer) logContainer.prepend(d);
}

// FIREBASE INITIALIZATION
let db = null;
const currentSessionId = 'session_' + Date.now();
let dbBuffer = [];
let totalLoggedSamples = 0;

try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp({ databaseURL: "https://vital-pal-db-default-rtdb.firebaseio.com" });
    db = firebase.database();
    addLog("Firebase Connected");
  }
} catch (err) {
  addLog("Offline Mode");
}

setInterval(() => {
  if (db && dbBuffer.length > 0) {
    const batchToSend = [...dbBuffer];
    dbBuffer = [];
    totalLoggedSamples += batchToSend.length;
    $('#dbCounter').textContent = `${totalLoggedSamples} samples logged`;

    const latest = batchToSend[batchToSend.length - 1];
    db.ref('live_telemetry').set({
      timestamp: Date.now(),
      bpm: latest.bpm,
      spo2: latest.spo2,
      ecg: latest.rawEcg,
      emg: latest.rawEmg
    });

    db.ref(`sessions/${currentSessionId}`).push({
      batch_time: new Date().toISOString(),
      samples_count: batchToSend.length,
      readings: batchToSend
    }).catch(err => {});
  }
}, 1000);

// CANVAS & PLOTTER ENGINE
function fit(c){const d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;c.getContext('2d').setTransform(d,0,0,d,0,0);return [r.width,r.height]}

const ecgC = $('#ecgCanvas'), ecgX = ecgC.getContext('2d');
const emgC = $('#emgCanvas'), emgX = emgC.getContext('2d');

let EW=300, EH=240;

const AD8232_GAIN = 1100.0, BIOAMP_GAIN = 2420.0, ADC_REF_VOLTS = 5.0, ADC_RESOLUTION = 1024.0;
const ECG_MV_PER_LSB = ((ADC_REF_VOLTS / ADC_RESOLUTION) / AD8232_GAIN) * 1000.0;
const EMG_UV_PER_LSB = ((ADC_REF_VOLTS / ADC_RESOLUTION) / BIOAMP_GAIN) * 1000000.0;

let globalSampleCount = 0;
const BUFFER_SIZE = 70;
let ecgBuffer = new Array(BUFFER_SIZE).fill(0);
let emgRawBuffer = new Array(BUFFER_SIZE).fill(0);

function initCanvases() {
  [EW, EH] = fit(ecgC);
  fit(emgC);
}

function drawSerialPlotter(ctx, buffer, width, height, strokeColor) {
  if (!buffer || buffer.length === 0) return;

  const marginLeft = 50, marginBottom = 20, marginTop = 10, marginRight = 10;
  const plotW = width - marginLeft - marginRight;
  const plotH = height - marginTop - marginBottom;

  let minVal = Math.min(...buffer);
  let maxVal = Math.max(...buffer);

  if (maxVal - minVal < 10) {
    const mid = (maxVal + minVal) / 2;
    minVal = mid - 10;
    maxVal = mid + 10;
  }

  const span = maxVal - minVal;
  const plotMin = minVal - span * 0.1;
  const plotMax = maxVal + span * 0.1;
  const plotRange = plotMax - plotMin || 1;

  ctx.lineWidth = 0.5;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.fillStyle = '#94a3b8';
  ctx.font = "10px 'JetBrains Mono', monospace";

  // Y-Axis Ticks
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const ratio = i / ySteps;
    const yPx = marginTop + plotH - (ratio * plotH);
    const val = minVal + ratio * span;

    ctx.beginPath();
    ctx.moveTo(marginLeft, yPx);
    ctx.lineTo(marginLeft + plotW, yPx);
    ctx.stroke();

    ctx.textAlign = "right";
    const labelStr = Math.abs(val) >= 100 ? Math.round(val).toString() : val.toFixed(1);
    ctx.fillText(labelStr, marginLeft - 6, yPx + 3);
  }

  // X-Axis Ticks
  const xSteps = 4;
  const startSample = Math.max(0, globalSampleCount - BUFFER_SIZE);
  for (let i = 0; i <= xSteps; i++) {
    const ratio = i / xSteps;
    const xPx = marginLeft + ratio * plotW;
    const sampleIdx = Math.round(startSample + ratio * BUFFER_SIZE);

    ctx.beginPath();
    ctx.moveTo(xPx, marginTop);
    ctx.lineTo(xPx, marginTop + plotH);
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.fillText(sampleIdx.toString(), xPx, height - 4);
  }

  // Waveform Trace
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 2.0;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.beginPath();
  buffer.forEach((v, i) => {
    const x = marginLeft + (i / (buffer.length - 1)) * plotW;
    const y = marginTop + plotH - ((v - plotMin) / plotRange) * plotH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  return { min: Math.round(minVal), max: Math.round(maxVal) };
}

function renderOscilloscopes() {
  ecgX.fillStyle = '#040d1a'; 
  ecgX.fillRect(0, 0, EW, EH);
  const ecgStats = drawSerialPlotter(ecgX, ecgBuffer, EW, EH, '#00E676');
  if (ecgStats) $('#ecgHeaderRange').textContent = `MIN: ${ecgStats.min} | MAX: ${ecgStats.max}`;

  emgX.fillStyle = '#0d121f'; 
  emgX.fillRect(0, 0, EW, EH);
  const emgStats = drawSerialPlotter(emgX, emgRawBuffer, EW, EH, '#f59e0b');
  if (emgStats) $('#emgHeaderRange').textContent = `MIN: ${emgStats.min} | MAX: ${emgStats.max}`;

  requestAnimationFrame(renderOscilloscopes);
}

// DIAGNOSTICS ENGINE
function evaluateHealthDiagnostics(bpm, spo2, rawEcg, rawEmg) {
  const badge = $('#healthBadge');
  const summary = $('#healthSummary');

  let status = "MONITORING";
  let colorClass = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
  let summaryText = [];

  if (bpm > 0) {
    if (bpm < 60) { status = "BRADYCARDIA"; summaryText.push("HR Low (< 60 BPM)."); }
    else if (bpm > 100) { status = "TACHYCARDIA"; summaryText.push("HR Elevated (> 100 BPM)."); }
    else { summaryText.push(`HR Normal (${Math.round(bpm)} BPM).`); }
  } else {
    summaryText.push("Awaiting pulse sensor.");
  }

  if (spo2 > 0) {
    if (spo2 < 90) { status = "CRITICAL HYPOXIA"; summaryText.push("SpO2 Critical (< 90%)."); }
    else if (spo2 < 95) { if (!status.includes("CRITICAL")) status = "MILD HYPOXIA"; summaryText.push("SpO2 Low (90-94%)."); }
    else { summaryText.push(`SpO2 Optimal (${Math.round(spo2)}%).`); }
  }

  if (Math.abs(rawEmg) > 100) summaryText.push("EMG Contraction active.");

  if (status.includes("CRITICAL")) colorClass = "bg-red-500/20 text-red-400 border-red-500/30";
  else if (status !== "MONITORING") colorClass = "bg-amber-500/20 text-amber-400 border-amber-500/30";

  badge.className = `mono text-xs px-2.5 py-0.5 rounded-full font-bold border ${colorClass}`;
  badge.textContent = status;
  summary.textContent = summaryText.join(" ");
}

// INGESTION ENGINE
function ingest(line) {
  line = line.trim();
  if (!line) return;

  try {
    const data = JSON.parse(line);
    const bpmVal  = data.bpm  || 0;
    const spo2Val = data.spo2 || 0;
    const rawEcg  = data.ecg  !== undefined ? data.ecg : 0;
    const rawEmg  = data.exg  !== undefined ? data.exg : 0;

    globalSampleCount++;

    const ecgMv = rawEcg * ECG_MV_PER_LSB;
    const emgUv = rawEmg * EMG_UV_PER_LSB;

    if (bpmVal > 0)  $('#bpm').textContent  = Math.round(bpmVal);
    if (spo2Val > 0) $('#spo2').textContent = `${Math.round(spo2Val)}%`;
    $('#ecgRaw').textContent = rawEcg;
    $('#ecgMv').textContent  = `${ecgMv.toFixed(2)} mV`;
    $('#emgRaw').textContent = rawEmg;
    $('#emgUv').textContent  = `${Math.round(emgUv)} µV`;

    $('#lock').textContent = bpmVal > 0 ? '● LOCKED' : '○ SEARCHING';
    $('#lock').className = bpmVal > 0 ? 'mono text-[10px] mt-1 text-emerald-400' : 'mono text-[10px] mt-1 text-amber-400';

    ecgBuffer.push(rawEcg);
    if (ecgBuffer.length > BUFFER_SIZE) ecgBuffer.shift();

    emgRawBuffer.push(rawEmg);
    if (emgRawBuffer.length > BUFFER_SIZE) emgRawBuffer.shift();

    evaluateHealthDiagnostics(bpmVal, spo2Val, rawEcg, rawEmg);
    dbBuffer.push({ ts: Date.now(), bpm: bpmVal, spo2: spo2Val, rawEcg, rawEmg });

  } catch (e) {}
}

// WEBSOCKET CONTROLLER
let ws = null, isWsConnected = false;

function connectWebSocket() {
  const ipInput = $('#wsIp');
  let host = ipInput ? ipInput.value.trim() : 'vitalpal.local';
  if (!host) host = 'vitalpal.local';

  let wsUrl = host;
  if (!wsUrl.startsWith('ws://') && !wsUrl.startsWith('wss://')) {
    if (!wsUrl.includes(':')) wsUrl = `ws://${wsUrl}:81`;
    else wsUrl = `ws://${wsUrl}`;
  }

  addLog(`Connecting to ${wsUrl}...`);

  try {
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      isWsConnected = true;
      $('#wsConnectBtn').textContent = "Disconnect";
      $('#wsStatus').textContent = "100 Hz Stream Active";
      $('#wsStatus').className = "mono text-xs px-3 py-1 rounded-full bg-emerald-900 text-emerald-200 font-bold";
      addLog("Gateway Connected");
    };

    ws.onmessage = (event) => ingest(event.data);
    ws.onerror = () => addLog("Connection error");
    ws.onclose = () => {
      isWsConnected = false;
      $('#wsConnectBtn').textContent = "Connect WebSocket";
      $('#wsStatus').textContent = "Disconnected";
      $('#wsStatus').className = "mono text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400 font-bold";
      addLog("Connection closed");
    };
  } catch (err) {
    addLog(`Error: ${err.message}`);
  }
}

async function connectBluetoothSerial() {
  try {
    if (!('serial' in navigator)) throw new Error('Web Serial unsupported');
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    addLog('Serial connected');
    const dec = new TextDecoderStream();
    port.readable.pipeTo(dec.writable);
    const rd = dec.readable.getReader();
    let acc = '';

    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      acc += value;
      const ls = acc.split('\n');
      acc = ls.pop();
      ls.forEach(ingest);
    }
  } catch (e) {
    addLog('Stream Error: ' + (e.message || 'closed'));
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initCanvases();
  renderOscilloscopes();

  const ipInput = $('#wsIp');
  const savedHost = localStorage.getItem('esp32_host') || 'vitalpal.local';
  if (ipInput) ipInput.value = savedHost;

  if (ipInput) {
    ipInput.addEventListener('change', () => {
      localStorage.setItem('esp32_host', ipInput.value.trim());
    });
  }

  setTimeout(() => {
    if (ipInput && ipInput.value.trim()) connectWebSocket();
  }, 500);

  $('#wsConnectBtn').addEventListener('click', () => {
    if (isWsConnected) { if (ws) ws.close(); } else { connectWebSocket(); }
  });

  $('#btBtn').addEventListener('click', connectBluetoothSerial);

  addLog("Dashboard initialized");
});

window.addEventListener('resize', initCanvases);
</script>
</body>
</html>
